name: Firmware and protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run
      - run: g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_measurement.cpp -o /tmp/sonar-tests && /tmp/sonar-tests
      - run: python -m unittest discover -s tests -v
